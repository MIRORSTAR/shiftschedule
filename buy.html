<!DOCTYPE html><html lang="ru"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift Schedule — оплата PRO</title>
  <meta name="description" content="Оплата Shift Schedule PRO на сайте через ЮKassa — для тех, кто не хочет привязывать карту к RuStore.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --accent: #4a8fe8;
      --text: #e8eaf0; --text2: #8b90a0; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card { background: var(--surface); border-radius: var(--radius); padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .price { font-size: 32px; font-weight: 800; color: var(--accent); margin: 16px 0; }
    p { color: var(--text2); font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
    .form-group { margin-top: 20px; text-align: left; }
    label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    input[type=email] {
      width: 100%; padding: 12px 16px; background: #0f1117;
      border: 1px solid #2a2d3d; border-radius: 10px; color: var(--text);
      font-size: 15px; outline: none;
    }
    input[type=email]:focus { border-color: var(--accent); }
    .submit {
      width: 100%; margin-top: 16px; padding: 14px; background: var(--accent);
      color: #fff; border: none; border-radius: 12px; font-size: 15px;
      font-weight: 600; cursor: pointer;
    }
    .submit:hover { opacity: 0.85; }
    .submit:disabled { opacity: 0.5; cursor: default; }
    .error { color: #e85a5a; font-size: 13px; margin-top: 12px; display: none; }
    .req-link { display: block; margin-top: 20px; font-size: 12px; }
    .req-link a { color: var(--text2); }
  </style>
  <!-- Yandex.Metrika -->
  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();
    for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window,document,"script","https://mc.yandex.ru/metrika/tag.js","ym");
    ym(109065744,"init",{clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:true});
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/109065744" style="position:absolute;left:-9999px;" alt=""/></div></noscript>
  <!-- /Yandex.Metrika -->
</head>
<body>
  <div class="card" id="card">
    <h1>Оплата на сайте скоро откроется</h1>
    <p>Сейчас идёт подключение платёжной системы. Пока доступна оплата через RuStore.</p>
    <a href="https://www.rustore.ru/catalog/app/com.mirorstar.shiftschedule" class="submit" style="display:block;text-decoration:none;text-align:center;">Открыть в RuStore</a>
  </div>

  <script>
    const PAYMENTS_LIVE = true;
    const PAYMENTS_URL = 'https://script.google.com/macros/s/AKfycbyIEqhxz-n3fu3CCgJoSd0e_n2uwoJ5Fn7AahhEUM92KQMWpS8tfevAZYHV2Vcveg/exec';

    if (PAYMENTS_LIVE) {
    document.getElementById('card').innerHTML =
      '<h1>Shift Schedule PRO</h1>' +
      '<div class="price">199 ₽ <span style="font-size:14px;color:var(--text2);font-weight:400;">/ навсегда</span></div>' +
      '<p>Синхронизация между устройствами, расписание партнёра, уведомления о сменах, экспорт в календарь, все темы оформления.</p>' +
      '<p>После оплаты промокод для активации PRO появится на следующей странице.</p>' +
      '<div class="form-group"><label>Email (для связи, если код не отобразится)</label><input type="email" id="email" placeholder="you@example.com"></div>' +
      '<button class="submit" id="payBtn">Оплатить через ЮKassa</button>' +
      '<p class="error" id="errorMsg"></p>' +
      '<p class="req-link"><a href="requisites.html">Реквизиты продавца</a></p>';

    document.getElementById('payBtn').addEventListener('click', async function() {
      const email = document.getElementById('email').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const btn = this;
      errorMsg.style.display = 'none';

      if (!email || email.indexOf('@') === -1) {
        errorMsg.textContent = 'Введите корректный email.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Создаём заказ...';

      try {
        const res = await fetch(PAYMENTS_URL + '?action=create', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ email: email })
        });
        const data = await res.json();
        if (!data.confirmationUrl) throw new Error('no confirmation url');
        window.location.href = data.confirmationUrl;
      } catch (e) {
        errorMsg.textContent = 'Не удалось создать заказ. Попробуйте позже или напишите в поддержку.';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Оплатить через ЮKassa';
      }
    });
    } // конец if (PAYMENTS_LIVE)
  </script>
</body></html>
