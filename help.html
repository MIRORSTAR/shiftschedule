<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница перенесена — инструкция ShiftSchedule</title>
  <meta name="description" content="Инструкции по приложению ShiftSchedule перенесены на страницу «Инструкция».">
  <link rel="canonical" href="https://mirorstar.github.io/shiftschedule/instructions.html">
  <meta http-equiv="refresh" content="0; url=instructions.html">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    :root { --bg: #15161b; --card: #23252d; --border: rgba(255,255,255,0.09); --text: #f0f0f3; --muted: #a3a4b0; --teal: #66b8b2; }
    [data-theme="light"] { --bg: #f8fafc; --card: #ffffff; --border: rgba(0,0,0,0.08); --text: #0f172a; --muted: #475569; --teal: #0d9488; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: 'Inter', 'Montserrat', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .box { max-width: 420px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
    a.go { display: inline-block; text-decoration: none; font-weight: 700; color: #04222b; background: var(--teal); border-radius: 10px; padding: 11px 22px; }
  </style>
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}</script>
</head>
<body>
  <div class="box">
    <h1>Инструкции переехали</h1>
    <p>Все инструкции по приложению теперь собраны на одной странице. Если переход не произошёл сам, нажмите кнопку.</p>
    <a class="go" href="instructions.html">Открыть инструкцию</a>
  </div>
</body>
</html>
